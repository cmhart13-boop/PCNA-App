name: Rebuild iPhone PCNA home hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-iphone-hero.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild home hero as native iPhone banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()

          s = s.replace(
              'Mkt_Dept/2026%20Jobs/2026-0810_Web_Messaging/0810_Web_PCNA_Hero.gif"\n    "?v=202608161659',
              'Mkt_Dept/2026%20Jobs/2026-0810_Web_Messaging/0810_Web_PCNA_Hero_m.gif"\n    "?v=202608161802',
              1,
          )

          old_header = '''  <div class="pcna-head">\n    <span class="pcna-head-icon">☰</span>\n    <img src="{logo}" class="pcna-head-logo" alt="PCNA">\n    <span class="pcna-head-icon pcna-head-bell">◇</span>\n  </div>'''
          new_header = '''  <div class="pcna-head">\n    <a href="https://www.pcna.com/en-us" target="_blank" rel="noopener noreferrer" aria-label="Open PCNA.com">\n      <img src="{logo}" class="pcna-head-logo" alt="PCNA">\n    </a>\n  </div>'''
          if old_header not in s:
              raise SystemExit('Expected old header not found')
          s = s.replace(old_header, new_header, 1)

          s = s.replace(
              '.pcna-head{{height:54px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin:0 0 6px;overflow:visible}}\n.pcna-head-logo{{height:60px;max-width:235px;width:auto;object-fit:contain;justify-self:center}}\n.pcna-head-icon{{font-size:29px;line-height:1;text-align:center;color:#063f80;font-weight:700;position:relative;z-index:2}} .pcna-head-bell{{font-size:26px}}\n.pcna-hero{{position:relative;display:block;height:188px;border-radius:17px;overflow:hidden;text-decoration:none!important;background:#063f80;box-shadow:0 5px 18px rgba(8,65,120,.18)}}\n.pcna-hero-img{{display:block;width:100%;height:100%;object-fit:cover;object-position:center}}',
              '.pcna-head{{height:64px;display:flex;align-items:center;justify-content:flex-start;margin:0 0 6px;overflow:visible;padding-left:2px}}\n.pcna-head a{{display:inline-flex;align-items:center;text-decoration:none!important}}\n.pcna-head-logo{{display:block;height:60px;max-width:235px;width:auto;object-fit:contain}}\n.pcna-hero{{position:relative;display:block;width:100%;height:188px;border-radius:17px;overflow:hidden;text-decoration:none!important;background:#063f80;box-shadow:0 5px 18px rgba(8,65,120,.18)}}\n.pcna-hero-img{{position:absolute;inset:0;display:block;width:100%!important;height:100%!important;max-width:none!important;object-fit:cover!important;object-position:center center!important;margin:0!important;padding:0!important}}',
              1,
          )

          s = s.replace(
              '@media(max-width:430px){{.block-container:has(.pcna-home){{padding-left:10px!important;padding-right:10px!important;padding-top:calc(2px + env(safe-area-inset-top))!important}} .pcna-head{{height:50px;margin-bottom:5px}} .pcna-head-logo{{height:60px}} .pcna-hero{{height:176px}}',
              '@media(max-width:430px){{.block-container:has(.pcna-home){{padding-left:10px!important;padding-right:10px!important;padding-top:calc(2px + env(safe-area-inset-top))!important}} .pcna-head{{height:62px;margin-bottom:5px}} .pcna-head-logo{{height:58px}} .pcna-hero{{height:176px}}',
              1,
          )
          s = s.replace(
              '@media(max-height:760px){{.pcna-head{{height:44px}} .pcna-head-logo{{height:58px}} .pcna-hero{{height:154px}}',
              '@media(max-height:760px){{.pcna-head{{height:58px}} .pcna-head-logo{{height:54px}} .pcna-hero{{height:154px}}',
              1,
          )

          start = s.index('def render_streamlit_mobile_home():')
          end = s.index('\ndef product_picker', start)
          home = s[start:end]
          forbidden = ['pcna-head-icon', 'pcna-head-bell', 'New & Trending', 'Fresh Arrivals', 'SHOP NOW', 'pcna-hero-copy', 'hero-products', '<iframe']
          found = [x for x in forbidden if x in home]
          if found:
              raise SystemExit(f'Forbidden home content remains: {found}')
          if home.count('class="pcna-hero-img"') != 1:
              raise SystemExit('Hero must contain exactly one image')
          if '0810_Web_PCNA_Hero_m.gif' not in s:
              raise SystemExit('Mobile dynamic hero asset missing')
          p.write_text(s)
          PY
      - name: Compile and verify source
        run: |
          python -m py_compile app.py core.py starter_data.py storage.py pcna_brain.py generation.py
          grep -F '0810_Web_PCNA_Hero_m.gif' app.py
          ! grep -F '0810_Web_PCNA_Hero.gif' app.py
          ! grep -F 'pcna-head-icon' app.py
          ! grep -F 'pcna-head-bell' app.py
      - name: Commit rebuilt iPhone hero
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Rebuild iPhone home hero as single dynamic PCNA banner"
          git push origin HEAD:main
