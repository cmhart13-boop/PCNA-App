name: One-time homepage source overhaul

on:
  push:
    branches: [main]
    paths:
      - 'scripts/one_time_home_overhaul.py'
      - '.github/workflows/one-time-home-overhaul.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Apply source-level homepage overhaul
        run: python scripts/one_time_home_overhaul.py
      - name: Audit architecture after migration
        run: |
          test -f app.py
          test ! -f _pcna_app_source.py
          ! grep -R "_pcna_app_source.py" -n app.py .github scripts --exclude=one_time_home_overhaul.py --exclude=one-time-home-overhaul.yml
          ! grep -n "source.replace\|source_path = Path(__file__)" app.py
          grep -n "home-action-grid" app.py
          grep -n "grid-template-columns: repeat(2, minmax(0, 1fr))" app.py
          grep -n "grid-template-rows: repeat(2, minmax(0, 1fr))" app.py
          ! grep -n "flex: 0 0 280px" app.py
          ! grep -n "overflow-y: hidden" app.py
      - name: Compile application
        run: python -m py_compile app.py core.py starter_data.py storage.py
      - name: Run deterministic tests
        run: PYTHONPATH=. pytest -q
      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/pcna-streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pcna-streamlit.log
          kill $PID || true
          exit 1
      - name: Commit migrated application
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A app.py _pcna_app_source.py
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Make app.py authoritative and rebuild mobile home cards"
          git push origin main
