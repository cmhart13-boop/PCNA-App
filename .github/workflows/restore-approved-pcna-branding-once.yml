name: Restore approved PCNA branding once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact logo and nav color only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()

          # Use exact existing repository asset. No image modification is performed.
          if 'def approved_pcna_header()' not in s:
              marker = 'def page_header(kicker: str, title: str, copy: str):\n    st.markdown(f\'<div class="page-kicker">{kicker}</div><div class="page-title">{title}</div><div class="page-copy">{copy}</div>\', unsafe_allow_html=True)\n\n\n'
              insert = '''def approved_pcna_header():\n    \"\"\"Render the locked approved PCNA logo asset exactly as stored in GitHub.\"\"\"\n    left, center, right = st.columns([1, 1.45, 1])\n    with center:\n        st.image(\"assets/pcna-logo.webp\", use_container_width=True)\n\n\n'''
              if marker not in s:
                  raise SystemExit('page_header marker not found')
              s = s.replace(marker, marker + insert, 1)

          page_marker = 'page = current_page()\n\n'
          if 'page = current_page()\n\napproved_pcna_header()\n\n' not in s:
              if page_marker not in s:
                  raise SystemExit('page marker not found')
              s = s.replace(page_marker, 'page = current_page()\n\napproved_pcna_header()\n\n', 1)

          # Darken only the bottom navigation background to the approved logo navy.
          old_nav = '.bottom-nav{{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);height:76px;background:var(--pcna);'
          new_nav = '.bottom-nav{{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);height:76px;background:#003b5c;'
          if old_nav in s:
              s = s.replace(old_nav, new_nav, 1)

          p.write_text(s)
          PY
          python -m py_compile app.py
          if git diff --quiet -- app.py; then
            echo "Branding already restored"
            exit 0
          fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Restore approved PCNA logo and navy nav"
          git push
