name: Sync exact live PCNA mobile hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-pcna-homepage.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read live PCNA A-spot and replace only app hero
        run: |
          python - <<'PY'
          import html, re, requests
          from pathlib import Path

          headers = {'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'}
          page = requests.get('https://www.pcna.com/', headers=headers, timeout=30)
          page.raise_for_status()
          text = page.text

          block = re.search(r'data-test-containerkey="HomepageHeroContainerSch"(?P<body>.*?)(?:<!-- B SPOTS -->)', text, re.S)
          if not block:
              raise SystemExit('Live PCNA A-spot hero block not found')
          body = block.group('body')
          src = re.search(r'<source\s+srcset="([^"]+\.gif[^"]*)"\s+media="\(max-width:\s*551px\)"', body, re.I)
          href = re.search(r'<a\s+href="([^"]+)"', body, re.I)
          if not src or not href:
              raise SystemExit('Live PCNA mobile hero source or destination not found')

          hero_url = html.unescape(src.group(1))
          hero_href = html.unescape(href.group(1))
          if hero_href.startswith('/'):
              hero_href = 'https://www.pcna.com' + hero_href
          print('LIVE_PCNA_MOBILE_HERO=', hero_url)
          print('LIVE_PCNA_HERO_LINK=', hero_href)

          p = Path('app.py')
          s = p.read_text()

          # Replace the dedicated PCNA_HERO_URL constant, not arbitrary markup.
          s, n = re.subn(
              r'PCNA_HERO_URL = \(\n\s*"https://assets\.pcna\.com/image/upload/f_auto,q_auto/"\n\s*"[^"]+"\n\s*"\?v=[^"]+"\n\)',
              'PCNA_HERO_URL = "' + hero_url + '?app_sync=202608161830"',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'Expected one PCNA_HERO_URL constant, replaced {n}')

          start = s.index('def render_streamlit_mobile_home():')
          end = s.index('\ndef product_picker', start)
          home = s[start:end]

          # Replace only the hero anchor destination. Header logo remains its own PCNA.com link.
          hero_anchor = re.compile(r'<a class="pcna-hero" href="[^"]+" target="_blank" rel="noopener noreferrer" aria-label="Open PCNA\.com">')
          home, n = hero_anchor.subn('<a class="pcna-hero" href="' + hero_href + '" target="_blank" rel="noopener noreferrer" aria-label="Open PCNA.com">', home, count=1)
          if n != 1:
              raise SystemExit(f'Expected one hero anchor, replaced {n}')
          s = s[:start] + home + s[end:]

          p.write_text(s)

          # Hard assertions: hero is one image and has no app-added copy/layers.
          s = p.read_text()
          start = s.index('def render_streamlit_mobile_home():')
          end = s.index('\ndef product_picker', start)
          home = s[start:end]
          hero_markup = re.search(r'<a class="pcna-hero".*?</a>', home, re.S)
          if not hero_markup:
              raise SystemExit('Hero markup missing after sync')
          markup = hero_markup.group(0)
          if markup.count('<img ') != 1:
              raise SystemExit('Hero must contain exactly one image')
          forbidden = ['New & Trending', 'Fresh Arrivals', 'Shop Here', 'SHOP NOW', 'pcna-hero-copy', 'hero-products', '<iframe', '<div']
          bad = [x for x in forbidden if x in markup]
          if bad:
              raise SystemExit(f'Forbidden app-added hero content remains: {bad}')
          if hero_url not in s:
              raise SystemExit('App is not using the exact live PCNA mobile hero')
          print('VERIFIED: exact live PCNA mobile A-spot hero, one image only')
          PY
      - name: Compile application
        run: python -m py_compile app.py core.py starter_data.py storage.py pcna_brain.py generation.py
      - name: Commit exact live hero sync
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "Hero already matches live PCNA A-spot"
            exit 0
          fi
          git commit -m "Use exact live PCNA rotating retail-brand hero"
          git push origin HEAD:main
