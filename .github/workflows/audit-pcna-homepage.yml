name: Audit live PCNA homepage hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-pcna-homepage.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PCNA homepage and discover current hero
        run: |
          python - <<'PY'
          import re, requests
          from pathlib import Path
          headers = {
              'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
          }
          r = requests.get('https://www.pcna.com/', headers=headers, timeout=30)
          print('STATUS', r.status_code)
          print('FINAL', r.url)
          text = r.text
          Path('/tmp/pcna.html').write_text(text)
          for needle in ['Ember','Sammy','Fitbit','Stitch','hero','carousel','banner']:
              print('\n===', needle, '===')
              for m in list(re.finditer(needle, text, re.I))[:20]:
                  a=max(0,m.start()-500); b=min(len(text),m.end()+1200)
                  print(text[a:b].replace('\n',' ')[:1800])
          urls = sorted(set(re.findall(r'https?://[^\"\'<> ]+', text)))
          print('\n=== ASSET URLS ===')
          for u in urls:
              if 'pcna' in u.lower() or 'cloudinary' in u.lower() or 'assets' in u.lower():
                  print(u[:1200])
          if r.status_code >= 400:
              raise SystemExit('PCNA fetch failed')
          PY
