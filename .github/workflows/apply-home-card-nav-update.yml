name: Apply PCNA home card and nav update

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_home_card_nav_update.py'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply requested UI recovery patch
        run: python scripts/apply_home_card_nav_update.py
      - name: Compile app
        run: python -m py_compile app.py
      - name: Commit app update if needed
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Apply static lifestyle hero and five-item nav"
          git push origin main
