name: Apply PCNA reference homepage

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_reference_home.py
      - .github/workflows/apply-pcna-reference-home.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved homepage layout
        run: python scripts/apply_reference_home.py
      - name: Validate app
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          if git diff --quiet; then
            echo "No homepage changes required"
            exit 0
          fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Match PCNA homepage to approved reference"
          git push origin main
