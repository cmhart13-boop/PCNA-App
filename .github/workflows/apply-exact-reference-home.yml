name: Apply exact PCNA reference homepage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exact-reference-home.yml'
      - 'scripts/apply_exact_reference_home.py'
      - 'home_reference.py'
      - 'assets/reference-home.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-exact-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact approved homepage
        run: python scripts/apply_exact_reference_home.py
      - name: Compile app
        run: python -m py_compile app.py home_reference.py
      - name: Commit exact homepage implementation
        run: |
          if git diff --quiet; then
            echo "No homepage patch required"
            exit 0
          fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Use approved screenshot as exact PCNA homepage shell"
          git push origin main
