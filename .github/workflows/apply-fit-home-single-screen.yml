name: Apply single screen homepage fit

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/fit_home_single_screen.py
      - run: python -m py_compile app.py
      - run: |
          if git diff --quiet -- app.py; then exit 0; fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Tighten homepage to one mobile screen"
          git push
