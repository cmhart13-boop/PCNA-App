name: Use original approved PCNA logo once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  swap-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point header to original approved logo asset only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = 'st.image("assets/pcna-logo.webp", use_container_width=True)'
          new = 'st.image("IMG_2337.webp", use_container_width=True)'
          if old not in s:
              raise SystemExit('Current header logo reference not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m py_compile app.py
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Use original approved PCNA logo asset"
          git push
