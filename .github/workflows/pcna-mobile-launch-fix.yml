name: Apply PCNA mobile launch fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_mobile_launch_fix.py
      - .github/workflows/pcna-mobile-launch-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply launch patch
        run: python scripts/apply_mobile_launch_fix.py
      - name: Validate Python
        run: python -m py_compile app.py core.py starter_data.py storage.py pcna_brain.py generation.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test Streamlit
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/pcna.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pcna.log
          kill $PID || true
          exit 1
      - name: Commit app fix
        run: |
          git config user.name "PCNA App Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py change needed"
            exit 0
          fi
          git commit -m "Fix PCNA single-splash mobile launch"
          git push origin HEAD:main
