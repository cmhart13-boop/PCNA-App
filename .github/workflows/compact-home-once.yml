name: Compact PCNA home once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  compact-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tighten homepage only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          replacements = {
              '.section-title{{font-size:18px;font-weight:850;letter-spacing:-.015em;margin:22px 0 10px;color:var(--pcna);}}': '.section-title{{font-size:18px;font-weight:850;letter-spacing:-.015em;margin:14px 0 7px;color:var(--pcna);}}',
              '.action-grid{{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:8px 0 10px;}}': '.action-grid{{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:5px 0 8px;}}',
              '.action-card{{display:block;text-decoration:none!important;border:1.5px solid rgba(8,79,134,.36);border-radius:17px;padding:17px 15px;background:#fff;min-height:122px;box-shadow:0 5px 0 rgba(8,79,134,.10),0 12px 24px rgba(8,79,134,.09);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;}}': '.action-card{{display:block;text-decoration:none!important;border:1.5px solid rgba(8,79,134,.36);border-radius:16px;padding:12px 13px;background:#fff;min-height:96px;box-shadow:0 4px 0 rgba(8,79,134,.10),0 9px 18px rgba(8,79,134,.08);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;}}',
              '.action-icon{{font-size:24px;line-height:1;margin-bottom:14px;color:var(--pcna);}}': '.action-icon{{font-size:21px;line-height:1;margin-bottom:8px;color:var(--pcna);}}',
              '.action-title{{font-size:16px;font-weight:850;color:var(--pcna);line-height:1.15;margin-bottom:6px;}}': '.action-title{{font-size:15px;font-weight:850;color:var(--pcna);line-height:1.12;margin-bottom:4px;}}',
              '.action-copy{{font-size:12px;color:var(--muted);line-height:1.35;}}': '.action-copy{{font-size:11px;color:var(--muted);line-height:1.25;}}',
              '@media(max-width:430px){{.block-container{{padding-top:calc(38px + env(safe-area-inset-top))!important;padding-left:12px!important;padding-right:12px!important;}}.page-title{{font-size:28px;line-height:1.1;}}.action-grid{{gap:11px;}}.action-card{{padding:15px 13px;min-height:116px;}}}}': '@media(max-width:430px){{.block-container{{padding-top:calc(30px + env(safe-area-inset-top))!important;padding-left:12px!important;padding-right:12px!important;}}.page-title{{font-size:28px;line-height:1.1;}}.section-title{{margin:10px 0 6px;}}.action-grid{{gap:9px;}}.action-card{{padding:10px 11px;min-height:88px;}}}}',
              '.pcna-live-shell{height:208px}.pcna-live-shell iframe{top:-82px;height:590px}': '.pcna-live-shell{height:188px}.pcna-live-shell iframe{top:-82px;height:590px}',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if changed:
              p.write_text(s)
          PY
          if git diff --quiet -- app.py; then
            echo "No homepage changes needed"
            exit 0
          fi
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Tighten homepage spacing and cards"
          git push
