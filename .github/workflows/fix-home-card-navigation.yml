name: Fix PCNA home card navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-navigation:
    if: github.event.head_commit.message == 'Fix PCNA home card navigation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Repair mobile card navigation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          pages = ['spec','virtual','quote','projects']
          for page in pages:
              old = f'<a class="pcna-card" href="?embed=true&page={page}">'
              new = f'<a class="pcna-card" href="?embed=true&page={page}" target="_self" onclick="event.preventDefault();window.location.assign(this.href);">'
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one home card for {page}; found {count}. Refusing broad edit.')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Acceptance audit
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          for page in ['spec','virtual','quote','projects']:
              expected = f'<a class="pcna-card" href="?embed=true&page={page}" target="_self" onclick="event.preventDefault();window.location.assign(this.href);">'
              assert s.count(expected) == 1, f'{page} card navigation missing or duplicated'
          assert s.count('class="pcna-card"') == 4, 'home card count changed unexpectedly'
          assert 'pcna-native-startup-cover' in s, 'startup architecture changed unexpectedly'
          assert 'PCNA_HERO_URL' in s, 'hero definition changed unexpectedly'
          print('PASS: all four home cards have explicit same-document mobile navigation')
          print('PASS: card count unchanged')
          print('PASS: startup and hero architecture retained')
          PY

      - name: Commit navigation fix and remove workflow
        run: |
          git config user.name "PCNA App Engineering"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-home-card-navigation.yml
          git add app.py
          git diff --cached --check
          git commit -m "Fix PCNA home card navigation on mobile"
          git push origin main
