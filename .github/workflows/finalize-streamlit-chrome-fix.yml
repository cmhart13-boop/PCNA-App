name: Finalize Streamlit chrome source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-streamlit-chrome-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source-level chrome fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = 'st.set_option("client.toolbarMode", "minimal")'
          if old not in s:
              raise SystemExit('expected toolbarMode source line not found')
          s = s.replace(old, 'st.set_option("client.toolbarMode", "viewer")', 1)
          p.write_text(s)
          PY
      - name: Verify source contract
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text()
          assert 'st.set_option("client.toolbarMode", "minimal")' not in s
          assert 'st.set_option("client.toolbarMode", "viewer")' in s
          assert "url.searchParams.set('embed', 'true')" in s
          assert '?embed=true&page=' in s
          r = Path('requirements.txt').read_text()
          assert 'streamlit==1.59.0' in r
          c = Path('.streamlit/config.toml').read_text()
          assert 'toolbarMode = "viewer"' in c
          print('chrome source contract verified')
          PY
      - name: Commit source fix and remove one-time workflow
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/finalize-streamlit-chrome-fix.yml
          git add app.py
          git commit -m "Fix Streamlit cloud chrome at source"
          git push origin main
