name: PCNA Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py core.py starter_data.py
      - name: Run deterministic workflow tests
        run: pytest -q
