name: Fix compact PCNA header

on:
  push:
    paths:
      - .github/workflows/fix-compact-pcna-header.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make only the requested header sizing change
        run: |
          sed -i 's/left, center, right = st.columns(\[1, 1.45, 1\])/left, center, right = st.columns([1.6, 1, 1.6])/' app.py
          sed -i 's/st.image("assets\/pcna-logo.webp", use_container_width=True)/st.image("assets\/pcna-logo.webp", width=105)/' app.py
      - name: Verify app and locked elements
        run: |
          python -m py_compile app.py
          grep -q 'st.image("assets/pcna-logo.webp", width=105)' app.py
          grep -q 'background:#003b5c' app.py
          grep -q 'live_pcna_banner()' app.py
          grep -q 'What do you need?' app.py
          grep -q 'Virtual Designs' app.py
          grep -q 'Quote Request' app.py
      - name: Commit the correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore compact approved PCNA header'
          git push origin HEAD:main
