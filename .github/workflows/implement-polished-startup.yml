name: Implement polished PCNA startup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'Implement polished PCNA startup and splash'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build startup architecture
        env:
          STARTUP_BLOCK_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('st.set_option("client.toolbarMode", "minimal")')
          end = s.index('\n\n\nPCNA_BLUE =', start)
          block = base64.b64decode(__import__('os').environ['STARTUP_BLOCK_B64']).decode('utf-8')
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY
      - name: Engineering acceptance audit
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          required = ['pcna-native-startup-cover','pcna-app-startup-cover',"target.searchParams.set('embed', 'true')","target.searchParams.set('pcna_startup', '1')",'requestAnimationFrame(() => requestAnimationFrame','2.75s','@keyframes pcnaStartupExit','?embed=true&page=']
          missing = [x for x in required if x not in s]
          print('compile: PASS')
          print('startup architecture:', 'PASS' if not missing else 'FAIL')
          if missing:
              raise SystemExit('Missing: ' + ', '.join(missing))
          PY
      - name: Commit implementation and remove one-time workflow
        run: |
          git config user.name "PCNA App Engineering"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/implement-polished-startup.yml
          git add app.py
          git commit -m "Build seamless branded PCNA startup"
          git push origin main
