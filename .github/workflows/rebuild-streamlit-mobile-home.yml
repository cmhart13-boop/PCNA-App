name: Rebuild Streamlit mobile home

on:
  push:
    branches: [main]
    paths:
      - 'scripts/rebuild_streamlit_mobile_home.py'
      - '.github/workflows/rebuild-streamlit-mobile-home.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair generator quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/rebuild_streamlit_mobile_home.py')
          s = p.read_text()
          s = s.replace("    html = f'''<!doctype html>", '    html = f\"\"\"<!doctype html>')
          s = s.replace("</html>'''\n    components.html", '</html>\"\"\"\n    components.html')
          p.write_text(s)
          PY
      - name: Rebuild mobile home source
        run: python scripts/rebuild_streamlit_mobile_home.py
      - name: Compile
        run: python -m py_compile app.py core.py starter_data.py storage.py pcna_brain.py generation.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test Streamlit
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/pcna-streamlit.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pcna-streamlit.log
          kill $PID || true
          exit 1
      - name: Commit rebuilt app
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py change needed"
            exit 0
          fi
          git commit -m "Rebuild Streamlit mobile home as single viewport shell"
          git pull --rebase origin main
          git push origin main
