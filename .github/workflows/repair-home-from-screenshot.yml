name: Repair PCNA home from screenshot

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_home_from_screenshot.py'
      - '.github/workflows/repair-home-from-screenshot.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair home
        run: python scripts/repair_home_from_screenshot.py
      - name: Compile
        run: python -m py_compile app.py core.py starter_data.py storage.py pcna_brain.py generation.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Streamlit smoke test
        run: |
          streamlit run app.py --server.headless true --server.port 8501 >/tmp/pcna.log 2>&1 &
          PID=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then
              kill $PID || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pcna.log
          kill $PID || true
          exit 1
      - name: Commit repaired app
        run: |
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No app.py changes"
            exit 0
          fi
          git commit -m "Repair PCNA mobile home from screenshot"
          git push origin HEAD:main
