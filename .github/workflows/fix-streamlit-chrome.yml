name: Fix Streamlit Community Cloud chrome at source

on:
  push:
    paths:
      - '.github/workflows/fix-streamlit-chrome.yml'

permissions:
  contents: write

jobs:
  fix-streamlit-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make embed mode persistent across every in-app navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          original = text

          # Root cause: Community Cloud's lower-right Manage app crown is Cloud chrome.
          # ?embed=true removes that chrome, but PCNA's own ?page=... links were replacing
          # the query string and silently dropping embed mode after navigation.
          text = text.replace(
              'return f"?page={quote(page)}"',
              'return f"?embed=true&page={quote(page)}"',
          )
          text = text.replace(
              'return "?page=projects"',
              'return "?embed=true&page=projects"',
          )
          text = text.replace('href="?page=', 'href="?embed=true&page=')

          if text == original:
              raise SystemExit('Expected PCNA navigation patterns were not found; refusing a no-op change.')

          # Regression guards: no app-owned page link is allowed to strip embed mode again.
          if 'href="?page=' in text:
              raise SystemExit('A raw ?page= anchor still exists and would re-enable Cloud chrome.')
          if 'return f"?page={quote(page)}"' in text:
              raise SystemExit('nav_link still drops embed mode.')
          if 'return "?page=projects"' in text:
              raise SystemExit('projects_link still drops embed mode.')

          app.write_text(text, encoding='utf-8')

          req = Path('requirements.txt')
          req_text = req.read_text(encoding='utf-8')
          req_text = req_text.replace('streamlit>=1.49.0', 'streamlit==1.61.1')
          req.write_text(req_text, encoding='utf-8')
          PY

      - name: Audit source before commit
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert '?embed=true&page=' in s
          assert 'href="?page=' not in s
          assert 'return f"?page={quote(page)}"' not in s
          assert 'return "?page=projects"' not in s
          assert 'streamlit==1.61.1' in Path('requirements.txt').read_text(encoding='utf-8')
          print('Source audit passed: embed mode is persistent and app.py compiles.')
          PY

      - name: Remove one-time repair workflow and commit source fix
        run: |
          rm .github/workflows/fix-streamlit-chrome.yml
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep PCNA app in Streamlit embed mode across navigation"
          git push origin main
