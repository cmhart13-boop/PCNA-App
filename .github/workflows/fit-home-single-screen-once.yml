name: Fit PCNA homepage on one mobile screen once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fit-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fit homepage into one phone viewport only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()

          old_css = '''@media(max-width:430px){
  .block-container{padding-top:calc(22px + env(safe-area-inset-top))!important;padding-left:14px!important;padding-right:14px!important;}
  .section-title{font-size:22px!important;margin:8px 0 9px!important;}
  .action-grid{gap:12px!important;margin-top:4px!important;}
  .action-card{padding:15px 14px!important;min-height:122px!important;border-radius:18px!important;}
  .action-icon{font-size:27px!important;margin-bottom:11px!important;}
  .action-title{font-size:18px!important;line-height:1.15!important;margin-bottom:6px!important;}
  .action-copy{font-size:13px!important;line-height:1.35!important;}
}'''
          new_css = '''@media(max-width:430px){
  .block-container{padding-top:calc(6px + env(safe-area-inset-top))!important;padding-left:10px!important;padding-right:10px!important;padding-bottom:84px!important;}
  .section-title{font-size:20px!important;margin:2px 0 4px!important;line-height:1.05!important;}
  .action-grid{gap:7px!important;margin:0!important;}
  .action-card{padding:9px 10px!important;min-height:92px!important;border-radius:15px!important;}
  .action-icon{font-size:23px!important;margin-bottom:5px!important;}
  .action-title{font-size:17px!important;line-height:1.08!important;margin-bottom:3px!important;}
  .action-copy{font-size:12px!important;line-height:1.18!important;}
  [data-testid="stImage"]{margin-bottom:-8px!important;}
  [data-testid="stVerticalBlock"]{gap:.15rem!important;}
}'''
          if old_css not in s:
              raise SystemExit('homepage mobile css marker not found')
          s = s.replace(old_css, new_css, 1)

          s = s.replace('approved_pcna_header(145 if page == "home" else 105)', 'approved_pcna_header(122 if page == "home" else 105)', 1)
          s = s.replace('@media(max-width:430px){.pcna-live-shell{height:218px}.pcna-live-shell iframe{top:-72px;height:610px}}', '@media(max-width:430px){.pcna-live-shell{height:150px}.pcna-live-shell iframe{top:-88px;height:560px}}', 1)
          s = s.replace('        height=230,\n        scrolling=False,', '        height=158,\n        scrolling=False,', 1)

          p.write_text(s)
          PY
          python -m py_compile app.py
          git config user.name "PCNA App Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.py
          git commit -m "Fit homepage on one mobile screen"
          git push
