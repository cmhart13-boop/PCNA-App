name: Repair PCNA functional routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair PCNA functional routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove launch redirect and isolate hero from app routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')

          start = s.find('# Community Cloud chrome (including the bottom-right "Manage app / Hosted by Streamlit"')
          end = s.find('# Suppress any remaining in-app Streamlit chrome in local/dev/self-hosted renders.')
          if start == -1 or end == -1 or end <= start:
              raise SystemExit('Expected embed redirect block not found; refusing broad edit')
          s = s[:start] + s[end:]

          s = s.replace(
              '<a class="pcna-hero" href="https://www.pcna.com/en-us" target="_blank" rel="noopener noreferrer" aria-label="Open PCNA.com">\n    <img src="{PCNA_HERO_URL}" class="pcna-hero-img" alt="PCNA lifestyle banner">\n  </a>',
              '<div class="pcna-hero" aria-label="PCNA lifestyle banner">\n    <img src="{PCNA_HERO_URL}" class="pcna-hero-img" alt="PCNA lifestyle banner">\n  </div>',
              1,
          )

          # Keep all app navigation as direct same-app query routes.
          s = s.replace('?embed=true&page=', '?page=')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Functional acceptance audit
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert 'window.location.replace' not in s, 'redirect still present'
          assert '?embed=true&page=' not in s, 'embed routing still present'
          assert 'href="?page=spec"' in s
          assert 'href="?page=quote"' in s
          assert 'href="?page=search"' in s
          assert 'href="?page=virtual"' in s
          assert 'elif page == "spec":' in s
          assert 'Generate Spec Sample' in s
          assert 'elif page == "quote":' in s
          assert 'Generate Quote' in s
          assert 'elif page == "search":' in s
          assert 'product_picker("search")' in s
          assert 'elif page == "virtual":' in s
          assert 'Generate Virtual' in s
          assert '<div class="pcna-hero"' in s
          print('PASS: no forced redirect or embed routing')
          print('PASS: spec, quote, product, virtual routes and controls present')
          print('PASS: hero is display-only and cannot hijack navigation')
          PY

      - name: Commit repair and remove workflow
        run: |
          git config user.name "PCNA App Engineering"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/repair-functional-routing.yml
          git add app.py
          git diff --cached --check
          git commit -m "Restore direct functional PCNA tool routing"
          git push origin main
